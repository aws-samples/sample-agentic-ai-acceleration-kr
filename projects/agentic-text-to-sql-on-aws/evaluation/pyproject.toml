[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evaluation"
version = "0.1.0"
description = "agentic Text-to-SQL Execution Accuracy(EX) code-based evaluator Lambda + goldset"
readme = "README.md"
requires-python = ">=3.11"
# Lambda 런타임(Python 3.13)은 표준 lib + boto3 만 사용한다 (의존성 zip 불필요).
dependencies = [
    "boto3>=1.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
