[project]
name = "sql-execution-mcp"
version = "0.1.0"
description = "AgentCore Runtime 호스팅 MCP 서버 — SQL AST 검증(SQLGlot allow-list) + RDS Data API 실행"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.13.0",
    "sqlglot>=27.0.0",
    "boto3>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_execution_mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
