[project]
name = "semantic-retrieval-mcp"
version = "0.1.0"
description = "AgentCore Runtime 호스팅 MCP 서버 — OpenSearch hybrid 검색으로 스키마/용어 컨텍스트 반환"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.13.0",
    "boto3>=1.40.0",
    "opensearch-py>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_retrieval_mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
