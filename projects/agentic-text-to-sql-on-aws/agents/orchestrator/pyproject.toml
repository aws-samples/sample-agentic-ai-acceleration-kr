[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestrator"
version = "0.1.0"
description = "agentic Text-to-SQL 오케스트레이터 에이전트 (Strands Graph + AgentCore Runtime, AG-UI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.50.1",
    "bedrock-agentcore[ag-ui,strands-agents]>=1.18.1",
    "mcp-proxy-for-aws>=0.1.0",
    "mcp>=1.9.0",
    "boto3>=1.34.0",
]

# dev 도구는 dependency-group 으로 둔다: `uv sync` 가 기본 설치하고,
# Dockerfile 의 `uv sync --no-dev` 는 제외한다.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
