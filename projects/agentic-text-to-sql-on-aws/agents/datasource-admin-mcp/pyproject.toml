[project]
name = "datasource-admin-mcp"
version = "0.1.0"
description = "AgentCore Runtime 호스팅 MCP 서버 — semantic 큐레이션 CRUD·승인 + 데이터소스 등록/점검/스키마 크롤(관리 평면)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.13.0",
    "boto3>=1.40.0",
    "semantic-layer",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

# semantic layer system-of-record(SemanticRepository)를 재사용한다 —
# DynamoDB 단일 쓰기 지점 원칙(ARCHITECTURE §4.4)을 admin 경로에서도 그대로 지키기 위함.
# 경로 의존성이므로 컨테이너 빌드 컨텍스트는 **레포 루트**여야 한다(Dockerfile 주석 참고).
[tool.uv.sources]
semantic-layer = { path = "../../semantic-layer" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasource_admin_mcp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
