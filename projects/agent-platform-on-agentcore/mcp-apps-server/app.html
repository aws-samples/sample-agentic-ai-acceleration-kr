  <style>
    /*

      --bg: var(--color-background-primary, Canvas);
      --fg: var(--color-text-primary, CanvasText);
      --muted: var(--color-text-secondary, color-mix(in srgb, var(--fg) 55%, transparent));
      --line: var(--color-border-primary, color-mix(in srgb, var(--fg) 15%, transparent));
      --panel: var(--color-background-secondary, color-mix(in srgb, var(--fg) 6%, transparent));
      --accent: var(--color-background-info, color-mix(in srgb, var(--fg) 12%, transparent));

      --radius: var(--border-radius-md, 8px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: var(--font-sans, ui-sans-serif, system-ui, -apple-system, sans-serif);
      font-size: var(--font-text-sm-size, 14px); line-height: var(--font-text-sm-line-height, 1.5);
      padding: 14px 16px 12px;
    }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h1 { font-size: var(--font-heading-xs-size, 16px); margin: 0; font-weight: var(--font-weight-semibold, 600); }
    .status { color: var(--muted); font-size: var(--font-text-xs-size, 12px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status.err { color: var(--danger); }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 8px; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .seg button { border: 0; border-radius: 0; }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button[aria-pressed="true"] { background: var(--accent); font-weight: var(--font-weight-semibold, 600); }
    button {
      font: inherit; color: var(--fg); background: transparent;
      border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 11px; cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--panel); }
    button:disabled { opacity: .5; cursor: default; }
    .spacer { flex: 1; }
    .chart { position: relative; height: 220px; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; background: var(--panel); }
    .chart.empty::after { content: "이 기간에는 데이터가 없습니다."; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }

    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-weight: var(--font-weight-medium, 500); }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: var(--panel); }
    tbody tr[aria-selected="true"] { background: var(--accent); }
    .kind { color: var(--muted); font-size: 11px; margin-left: 6px; }
    footer { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .foot { color: var(--muted); font-size: var(--font-text-xs-size, 11.5px); }
