# ============================================================================
# LLM Gateway — Helm Chart 공통 기본값
# ----------------------------------------------------------------------------
# 이 파일은 모든 환경(EKS Fargate dev/prod)이 상속하는
# 공통 기본값을 정의합니다. 환경별 차이는 values-{env}.yaml 에서 오버라이드합니다.
#
# 설계 원칙:
#   1. stateful(Postgres/Redis)은 기본 off — 외부 관리형(Aurora/ElastiCache 등) 사용
#   2. 모든 서비스는 resource limit/request + probe + SecurityContext 필수
#   3. Secret 주입은 두 가지 모드 지원: Helm Secret vs ExternalSecrets Operator
#   4. IRSA annotation은 EKS 배포에서 적용
# ============================================================================

# ----------------------------------------------------------------------------
# Global: 전체 chart에 적용되는 메타/레지스트리 설정
# ----------------------------------------------------------------------------
global:
  # 고객 private registry 사용 시: global.imageRegistry 에 prefix 주입
  # 예: "harbor.customer.com/llm-gateway" → 각 서비스 이미지 앞에 붙음
  imageRegistry: ""

  # Private registry 인증 시크릿 이름 목록
  imagePullSecrets: []
  # - name: regcred

  # 모든 리소스에 붙는 공통 라벨
  commonLabels: {}
  # team: platform-ai

  # 모든 리소스에 붙는 공통 어노테이션
  commonAnnotations: {}

  # 배포 환경 플래그 (dev | staging | prod) — app에 APP_ENV 로 주입
  environment: dev

  # 배포 모드 (eks-fargate) — 조건부 리소스 분기에 사용
  deploymentMode: eks-fargate

# ----------------------------------------------------------------------------
# Name overrides
# ----------------------------------------------------------------------------
nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------------------------------
# Service Account (공통 기본) — 서비스별로 개별 SA 생성 가능
# ----------------------------------------------------------------------------
serviceAccount:
  # chart 공통 SA 생성 여부. 서비스별 SA는 서비스 섹션 내 serviceAccount에서 별도 제어.
  create: true
  name: ""
  # EKS Fargate에서 IRSA 쓸 때 주입. EKS 외 환경에선 빈 객체.
  annotations: {}
  # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/llm-gateway-common
  automountServiceAccountToken: true

# ----------------------------------------------------------------------------
# Pod 공통 SecurityContext (NFR-3 보안 baseline)
# ----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # admin-ui Next.js가 /tmp 쓰기 필요 — 서비스별 오버라이드
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000

# ----------------------------------------------------------------------------
# Network Policy (NFR-3.11)
# ----------------------------------------------------------------------------
networkPolicy:
  enabled: true
  # data-plane/control-plane 분리 — gateway-proxy vs admin-api 네트워크 구분
  allowedIngressNamespaces: []
  # - name: monitoring  # Prometheus scrape 허용

# ----------------------------------------------------------------------------
# 외부 의존성 (PostgreSQL / Redis / Bedrock)
# ----------------------------------------------------------------------------
database:
  # ⚠️ 프로덕션에선 반드시 외부 관리형(Aurora/PostgreSQL HA)을 주입.
  # 이 chart의 subchart(postgresql)는 dev/테스트 전용이며 기본 off.
  enabled: false  # 이 값이 true면 chart가 in-cluster Postgres를 띄움 (dev용)

  # 외부 DB 연결 설정 (production)
  external:
    host: ""             # 예: llm-gateway.cluster-xxx.ap-northeast-2.rds.amazonaws.com
    port: 5432
    name: "gateway"
    # Application user — 모든 서비스 (gateway-proxy, admin-api, scheduler, notification-worker 등) 공통.
    # migration Job 이 이 유저를 자동 생성/업데이트하고 모든 schema 에 필요한 권한을 부여.
    user: "gateway"
    # notification-worker 호환용 (과거에는 별도 유저였지만 현재는 공통 유저로 통일).
    notificationWorkerUser: "gateway"
    # Application user 비밀번호 Secret 참조.
    passwordSecretName: "llm-gateway-db"
    passwordSecretKey: "password"
    notificationWorkerPasswordSecretKey: "password"
    # Master user (Aurora 자동 생성 superuser). migration Job 이 init SQL 실행 + application user 생성용.
    # 로컬 docker-compose 에서는 필요 없음 (postgres 컨테이너가 init SQL 자체 처리).
    masterUser: "postgres_admin"
    masterPasswordSecretKey: "master_password"
    # Master 비번을 어느 Secrets Manager 시크릿/프로퍼티에서 가져올지.
    # ⚠️ enable_rds_proxy=true (Terraform 이 <prefix><env>/db 를 관리) 환경에서는 이 두 값을
    #    반드시 설정해야 한다. Terraform 이 만드는 /db 에는 password 키만 있고
    #    master_password 는 없다 (RDS 가 7일마다 로테이션해서 복사본이 stale 해지므로 삭제됨).
    #    미설정 시 ESO 가 <prefix><env>/db 의 master_password 를 찾다 실패 → ExternalSecret
    #    이 Ready 가 안 되고 migration Job initContainer 가 5분 타임아웃으로 죽는다.
    #   masterPasswordRemoteKey: "rds!cluster-<uuid>"   (이름만, suffix 불필요)
    #   masterPasswordRemoteProperty: "password"
    #   조회: aws rds describe-db-clusters --db-cluster-identifier <id> \
    #           --query 'DBClusters[0].MasterUserSecret.SecretArn'
    # (ESO IRSA 정책에 rds!cluster-* read 권한 필요 — irsa 모듈에 선언됨.)
    # 빈 값은 operator 가 손으로 만든 레거시 /db (enable_rds_proxy=false 경로) 하위호환 전용.
    masterPasswordRemoteKey: ""        # 빈 값 → 레거시 "<prefix><env>/db" 사용
    masterPasswordRemoteProperty: ""   # 빈 값 → 레거시 "master_password" 사용
    # SSL 모드 (Aurora는 require 권장)
    sslMode: "require"
    # 연결 풀
    poolSize: 10
    maxOverflow: 20
    # 풀 고갈 시 커넥션 대기 상한(초). 과거엔 db.py 가 이 값을 안 읽어(cosmetic) SQLAlchemy
    # 기본 30s 로 동작 → "CPU 정상인데 느림" 지연. 견고성 6축검증 후 db.py 배선 완료 +
    # 10s 로 낮춰 fast-fail(TimeoutError). HealthChecker 도 같은 풀이라 고갈 시 10s 내 감지.
    poolTimeout: 10
    poolRecycle: 3600
    # asyncpg prepared statement 캐시 크기.
    # RDS Proxy 경유 환경에선 0 으로 override (PostgreSQL pinning 회피).
    # Aurora/Postgres 직접 연결 환경에선 기본값 100 유지 (성능 이득).
    #
    # ⚠️ 이 값이 **여기 있는 것이 중요하다.** 예전에는 템플릿이
    #      DB_STATEMENT_CACHE_SIZE: {{ ... | default 100 | quote }}
    #    였는데 Go 템플릿의 `default` 는 0 을 "빈 값" 으로 보고 삼킨다. 그래서 dev/prod
    #    overlay 가 둘 다 `statementCacheSize: 0` 을 명시했는데도 라이브 ConfigMap 은
    #    양쪽 다 "100" 이었다(2026-09-04 실측) — RDS Proxy pinning 회피 설정이 조용히
    #    죽어 있었다. 기본값을 values 로 옮기고 템플릿의 `| default` 를 제거해서 0 이
    #    그대로 통과하게 했다. 이 키를 여기서 지우면 렌더가 빈 문자열이 된다.
    statementCacheSize: 100

# Rate-limit 정책(deepdive Q50). failMode: open=eval 실패 시 통과(가용성·기본),
# closed=차단(쿼타 정확성). **무단 전환 금지** — budget/auth 는 이미 fail-closed 라
# 의도적 비대칭(RL 은 남용방지지 과금 게이트 아님). 운영 정책 결정 후에만 closed.
rateLimit:
  failMode: open

redis:
  enabled: false  # true면 in-cluster Redis 띄움 (dev용)

  # gateway-proxy pod 당 Redis 커넥션 풀 크기.
  # T2 v3 에서 50 은 4k VU hold 에서 MaxConnectionsError → 429 유발.
  # 30 pod × 150 = 4,500 커넥션 (ElastiCache 3-shard 기준 shard 당 1,500 여유).
  poolSize: 150

  # Redis 클라이언트 타이밍. 예전엔 이 4개가 values 에 없고 configmap 템플릿의
  # `| default` 만이 유일한 출처였다. statementCacheSize 와 같은 0-삼킴 함정이 있어
  # (retries: 0 = 재시도 없음, healthCheckInterval: 0 = health check 비활성 — 둘 다
  # 의미 있는 0 인데 조용히 1 / 30 으로 바뀐다) 기본값을 values 로 끌어올리고
  # 템플릿의 `| default` 를 제거했다. 값은 기존 템플릿 기본값과 **동일**하다(렌더 무변화).
  socketTimeout: 2.0
  connectTimeout: 1.0
  retries: 1
  healthCheckInterval: 30.0

  # 읽기 replica 라우팅(cluster+replica 일 때만). 기본 false = primary-only(강한 일관성).
  # 예전엔 이 키가 values 에 아예 없고 configmap 의 `| default false` 만이 출처였다.
  readFromReplicas: false

  # rate-limit 회로 차단기(deepdive Q50 Phase3/4). Redis 연속 실패 시 회로 OPEN →
  # 후속 eval 을 socket_timeout 대기 없이 즉시 fast-fail(→ fallback). 기본 활성.
  breaker:
    # ⚠️ 예전 템플릿은 `| default true` 였다 — Go 의 default 는 false 를 빈 값으로 보므로
    #    overlay 에 `enabled: false` 를 써도 "true" 로 렌더됐다. 즉 **values 로 차단기를
    #    끌 수 없는** 상태였다(현재 overlay 중 끄는 곳은 없어 라이브 영향은 0).
    #    템플릿에서 default 를 제거했으니 이제 여기 값이 유일한 출처다.
    enabled: true
    failThreshold: 5      # 연속 실패 N 회 → OPEN
    recoveryTimeout: 5.0  # OPEN 후 N 초 뒤 HALF_OPEN 시험

  external:
    host: ""  # 예: gateway-cache.xxx.cache.amazonaws.com
    port: 6379
    db: 0
    # TLS 사용 여부 (ElastiCache encryption-in-transit)
    tls: false
    # Password 인증 (ElastiCache AUTH 또는 Redis ACL)
    passwordSecretName: ""
    passwordSecretKey: "password"
    # Redis Cluster mode (Helm이 URI에 cluster 모드 플래그 주입)
    clusterMode: false

# ----------------------------------------------------------------------------
# Bedrock / AWS 설정
# ----------------------------------------------------------------------------
aws:
  region: "ap-northeast-2"
  # Bedrock 호출 가능한 모델 ID 화이트리스트 (IAM Policy와 일치해야 함)
  bedrockAllowedModels: []
  # - anthropic.claude-sonnet-4-20250514-v1:0
  # STS 검증 허용 리전
  allowedStsRegions:
    - "ap-northeast-2"
  # IAM Identity Center Permission Set 이름 화이트리스트 (FR-2.1a)
  # 이 값이 비어있으면 CLI 인증 실패. 프로덕션에선 반드시 주입.
  allowedIamRoles: []
  # - Customer-Developer

# ----------------------------------------------------------------------------
# 인증 (JWT / VK 암호화)
# ----------------------------------------------------------------------------
auth:
  jwt:
    algorithm: "RS256"
    issuer: ""  # 예: https://sso.example.com
    audience: "llm-gateway"
    # JWT 검증용 JWKS 엔드포인트 (public keys 가져올 URL)
    jwksUri: ""
    # JWKS 캐시 TTL (초)
    jwksCacheTtl: 3600
  virtualKey:
    # AES-256-GCM DEK (64-char hex) — Secret에서 주입
    encryptionKeySecretName: "llm-gateway-app"
    encryptionKeySecretKey: "virtual_key_encryption_key"
    # 로테이션 준비: 이전 버전 키 (복호화 전용)
    extraKeysEnabled: false

# ----------------------------------------------------------------------------
# Ingress (ALB on EKS)
# ----------------------------------------------------------------------------
ingress:
  enabled: true
  # "alb" (EKS Fargate)
  className: "nginx"

  # ALB(EKS) 어노테이션 — 세 Ingress 에 공통 적용.
  # Ingress 하나에만 필요한 규칙은 여기 넣지 말고 아래 전용 맵을 쓸 것.
  annotations: {}

  # gateway-proxy (사용자 API, data-plane)
  gateway:
    host: "gateway.example.com"
    path: "/"
    pathType: "Prefix"
    tls:
      enabled: false
      secretName: ""
    # 이 Ingress 에만 붙는 어노테이션. 공통값을 덮어쓴다.
    # data-plane 전용 규칙 자리 — 특히 CloudFront 를 오리진 앞에 둔 구성에서:
    #   alb.ingress.kubernetes.io/security-group-prefix-lists: "pl-xxxxxxxx"
    # (리전마다 ID 가 다르므로 이름으로 조회할 것:
    #  aws ec2 describe-managed-prefix-lists --filters
    #    Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing)
    # ⚠️ 이 값을 위 공통 annotations 에 넣으면 admin-api·admin-ui 까지 임의의
    #    CloudFront 배포에 열려 IP 제한이 무력화된다.
    annotations: {}

  # admin-ui (관리자 웹)
  adminUi:
    host: "admin.example.com"
    path: "/"
    pathType: "Prefix"
    tls:
      enabled: false
      secretName: ""
    # 이 Ingress 에만 붙는 어노테이션. 공통값과 템플릿 기본값
    # (healthcheck-path=/api/health, success-codes=200) 을 모두 덮어쓴다.
    annotations: {}

  # admin-api (관리자 REST API)
  adminApi:
    host: "admin-api.example.com"
    path: "/"
    pathType: "Prefix"
    tls:
      enabled: false
      secretName: ""
    # 이 Ingress 에만 붙는 어노테이션. 공통값을 덮어쓴다.
    annotations: {}

# ----------------------------------------------------------------------------
# External Secrets Operator 연동 (ESO 사용 시 K8s Secret 대신 동적 주입)
# ----------------------------------------------------------------------------
externalSecrets:
  enabled: false
  # SecretStore 또는 ClusterSecretStore 참조
  secretStoreRef:
    kind: "ClusterSecretStore"  # "SecretStore" | "ClusterSecretStore"
    name: "aws-secrets-manager"
  # Secrets Manager의 secret 경로 prefix
  # 예: "/llm-gateway/prod/" 밑에 db, app, jwt 등이 존재
  secretPathPrefix: "/llm-gateway/"
  refreshInterval: "1h"

# ----------------------------------------------------------------------------
# Observability — OpenTelemetry
# ----------------------------------------------------------------------------
observability:
  otel:
    # 전송 모드: "sidecar" (Pod마다 Collector 사이드카) | "managed" (AWS ADOT 등 외부) | "in-cluster" (DaemonSet/Deployment)
    mode: "in-cluster"

    # Collector 엔드포인트 (sidecar 모드에선 localhost:4317, in-cluster는 Service DNS)
    endpoint: "otel-collector.observability.svc.cluster.local:4317"
    protocol: "grpc"  # grpc | http/protobuf

    # Sidecar 이미지 (mode=sidecar 일 때만)
    # ⚠️ 현재 dev·prod 모두 mode="in-cluster" 이므로 이 블록은 **렌더되지 않는다**
    #    (templates/gateway-proxy/deployment.yaml 의 sidecar 블록이 mode 로 가드됨.
    #     실측: 두 클러스터 어느 파드에도 otel 컨테이너 없음). 즉 값이 틀려도 라이브
    #    영향은 0 이지만, mode 를 sidecar 로 돌리는 순간 조용히 구버전이 뜬다.
    # 그래서 in-cluster 로 실제 돌고 있는 Collector 와 **같은 버전**으로 맞춰 둔다:
    #   deployment/observability/otel-collector/deployment.yaml:44 = 0.113.0
    #   라이브 ns observability (dev·prod 양쪽) = otel/opentelemetry-collector-contrib:0.113.0
    sidecarImage:
      repository: "otel/opentelemetry-collector-contrib"
      tag: "0.113.0"
      pullPolicy: "IfNotPresent"

# ============================================================================
# 서비스별 설정
# ============================================================================

# ⚠️ 아래 7개 워크로드의 image.tag 는 모두 **라이브에서 돌고 있는 태그**로 채워져 있다
#    (2026-09-04 실측: dev rev87 / prod rev14 파드의 실제 이미지. 두 환경 동일).
#    예전에는 전부 `tag: ""` 였고 그러면 _helpers.tpl:76 의
#      $tag := .image.tag | default .root.Chart.AppVersion
#    이 Chart.appVersion(당시 1.0.43-rebrand) 으로 폴백했다. 그 태그들은 ECR 에 실재하므로
#    **ImagePullBackOff 로 실패하지도 않고 조용히 5개 서비스가 ~3.5개월 롤백**된다.
#    env overlay 를 안 넘기는 경로(신규 overlay 복사, --reuse-values 실수, values 만 넘긴
#    helm upgrade, prod-loadtest overlay 단독 사용)가 전부 그 폴백을 탄다.
#    특히 migration 은 appVersion 이미지가 alembic 0004 까지만 담고 있어(라이브는 0033)
#    실행되면 스키마 기준이 29 리비전 뒤로 간다.
#    → overlay 와 값이 같으므로 렌더 결과는 지금과 완전히 동일(라이브 무변화)하고,
#      폴백 자체가 사라져서 후퇴 경로만 없어진다. 배포 시엔 계속 overlay 가 우선한다.
# ----------------------------------------------------------------------------
# DB Migration (Helm pre-install / pre-upgrade hook으로 1회 실행)
# ----------------------------------------------------------------------------
migration:
  enabled: true
  image:
    repository: "llm-gateway/migration"
    tag: "1.0.52-head0033"  # = 라이브(dev·prod). alembic head 0033
    pullPolicy: "IfNotPresent"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  # Helm hook 타이밍
  hooks:
    - "pre-install"
    - "pre-upgrade"
  # 마이그레이션 실패 시 helm install/upgrade 전체를 롤백할지
  hookDeletePolicy: "before-hook-creation,hook-succeeded"
  activeDeadlineSeconds: 600  # 10분 안에 끝나지 않으면 실패로 판정
  # initContainer 가 ExternalSecret 의 K8s Secret sync 완료를 대기할 때 사용.
  #
  # ⚠️ 옛 주석("major.minor 태그가 없어 latest 또는 1.30.13 같은 full version 을 쓴다")은
  #    이제 **틀렸다**. docker.io/bitnami/kubectl 에서 **버전 태그가 전부 사라졌다**
  #    (2026-09-04 실측: 1.30 / 1.31 / 1.31.14 / 1.37.0 모두 registry 404. `latest` 만 200).
  #    그래서 태그 핀은 불가능하고 **digest 핀이 유일한 재현 가능 방법**이다.
  #    아래 digest = 지금 라이브(dev rev87 / prod rev14 hook manifest)가 `latest` 로
  #    당겨오고 있는 그 이미지와 동일(kubectl 1.37.0, 2026-09-04 재측정에서도 불변).
  #    → 렌더 결과의 실체는 그대로이고 mutable 태그만 고정된다(라이브 무변화).
  #
  #    이게 왜 중요한가: 이 Job 은 pre-install/pre-upgrade hook(weight -5) 이라 dev·prod
  #    **모든 helm upgrade 에서 매번 실행**되고, Fargate 는 파드마다 새 microVM 이라
  #    imagePullPolicy: IfNotPresent 여도 사실상 매번 Docker Hub 익명 pull 이다.
  #    태그가 움직이면 같은 chart SHA 가 매 배포마다 다른 코드를 돌리고,
  #    `latest` 에서 /bin/sh 가 빠지는 날 아래 `sh -c` wait 루프가 깨져
  #    migration hook 이 죽고 helm upgrade 전체가 실패한다.
  #
  # 대안 검토 (실측 결과 둘 다 지금은 못 쓴다):
  #   - registry.k8s.io/kubectl:v1.31.14 (서버 버전과 정확히 일치, 200 OK) → **distroless**.
  #     이미지에 bin/kubectl 하나뿐이고 sh/bash/busybox 가 0개라 `sh -c` 루프가 못 돈다
  #     (레이어 전수 확인). 쓰려면 wait 루프를 셸 없이 재작성해야 한다.
  #   - alpine/kubectl 도 버전 태그 404 (`latest` 만 존재).
  # 권장 후속: 이 digest 를 자체 ECR 로 미러링하고 여기서 ECR 주소를 참조
  #           (익명 Docker Hub pull rate limit / egress 정책 의존 제거).
  #           고객이 외부 이미지를 못 쓰는 환경도 같은 방법으로 override.
  waitForSecret:
    image: "bitnami/kubectl@sha256:b29d8c1665b70817259ceecaea16ab27aab6368b48daf485d19436c809067492"

# ----------------------------------------------------------------------------
# Gateway Proxy (U1, data-plane) — 요청 라우팅 + 인증 + Rate Limit + 비용 기록
# ----------------------------------------------------------------------------
gatewayProxy:
  enabled: true
  replicaCount: 2  # prod에선 3+ 권장 (values-*-prod.yaml에서 override)

  image:
    repository: "llm-gateway/gateway-proxy"
    tag: "1.0.55-runtimeplane"  # = 라이브(dev·prod)
    pullPolicy: "IfNotPresent"

  serviceAccount:
    # IRSA 필요 (FR-2.4) — Bedrock 호출용 IAM Role
    create: true
    name: "gateway-proxy"
    annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/llm-gateway-gateway-proxy-bedrock

  service:
    type: "ClusterIP"
    port: 8000
    targetPort: 8000

  # SSE 스트리밍 타임아웃 (→ configmap 의 STREAM_IDLE_TIMEOUT /
  # STREAM_DISCONNECT_DRAIN_TIMEOUT). config.py 의 기본값과 동일하게 둔다.
  #
  # ⚠️ **idleTimeout 은 ALB idle_timeout 보다 반드시 작아야 한다.**
  #   dev  ALB 300s → 240 (values-eks-fargate-dev.yaml)
  #   prod ALB 600s → 540 (values-eks-fargate-prod.yaml)
  # 크거나 같으면 ALB 가 먼저 끊어 클라이언트가 truncated stream 을 본다(원인 추적이
  # 어려운 실패). ALB 의 idle_timeout 을 바꿀 때 이 값도 함께 내려/올려야 한다.
  # 아래쪽 하한은 upstream 첫 토큰 지연 — Opus extended thinking 은 60s 를 넘긴다.
  streaming:
    idleTimeout: 240
    # 클라이언트 끊김 후 upstream 을 계속 소비해 usage 를 보존하는 상한(과금 정확성).
    disconnectDrainTimeout: 30

  # SSE 장시간 연결 수용 → HPA는 CPU 기반 + 충분한 maxReplicas 필요
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

  # HPA 는 CPU 만 사용. memory 는 제외.
  # 이유: Gateway/FastAPI 는 CPU bound. Python allocator 특성상 memory 는 request
  # 대비 상시 높게 측정되어 memory HPA 가 의미 없는 scale-out 루프를 유발함.
  # Memory leak/급증은 livenessProbe + Prometheus alert 로 감지.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1  # SSE 스트림 보호 — 최소 1개는 항상 가용

  # SSE 스트림이 길어질 수 있으니 terminationGracePeriodSeconds 충분히
  terminationGracePeriodSeconds: 60

  livenessProbe:
    httpGet:
      path: "/health"
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  # readiness 는 /health/ready (엄격) — DB_DEGRADED/풀 포화 시 503 → 고장 파드를 endpoint 에서
  # 제외(트래픽 차단). liveness 는 /health(관대) 유지 → 재시작 cascade 회피. (견고성 6축검증 축⑤)
  readinessProbe:
    httpGet:
      path: "/health/ready"
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # Startup probe — 초기 로드(Redis 캐시 주입 등) 시간 확보. startup 은 /health(관대) 유지:
  # 기동 직후 캐시 워밍 중 degradation 이 잠깐 non-HEALTHY 여도 startup 을 통과해야 함.
  startupProbe:
    httpGet:
      path: "/health"
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30  # 최대 150초 기동 대기

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # 앱 고유 env 변수 (configmap에서 읽거나 직접 주입)
  env:
    LOG_LEVEL: "INFO"
    # uvicorn 워커 수 — gateway-proxy Dockerfile CMD 가 ${WORKERS:-4} 로 읽는다(1.0.98+).
    # Fargate cpu request 기준 워커당 CPU 기아를 피하도록 설정(0.5 vCPU=2, 0.25 vCPU=1~2).
    # ⚠️ 1.0.98 이전 이미지는 CMD 가 --workers 4 하드코딩이라 이 값이 무시됐음(죽은 설정).
    WORKERS: "2"
    OPENMODEL_BASE_URL: ""  # 사내 vLLM 엔드포인트. 미사용
    # Redis 스트림 / 예산 관련
    COST_STREAM_KEY: "cost:stream"
    BUDGET_DEFAULT_POLICY: "HARD_BLOCK"
    # Rate limit cache TTL
    RATE_LIMIT_CONFIG_TTL_SEC: "300"
    # ── 요청/응답 **본문** 로깅 (기본 OFF) ──
    #
    # ⚠️ 켜면 게이트웨이가 요청 JSON 전문과 스트리밍 SSE 텍스트 전문을 S3 로 보낸다.
    #    **마스킹하지 않는다** — 사용자가 프롬프트에 붙여 넣은 것이 그대로 저장된다.
    #    같은 코드베이스의 trace 경로에는 PII 마스커가 기본 ON 이지만 본문 로거에는
    #    적용되지 않는다(알고 있는 격차, 향후 개선 대상).
    #
    # 잠금이 두 겹이다. **둘 다** 열려야 수집이 시작된다:
    #   1) 아래 FIREHOSE_STREAM_NAME 이 비어 있지 않아야 한다(정적). 비어 있으면 로거는
    #      no-op 이고 boto3 클라이언트조차 만들지 않는다 — 로컬/compose 에서 자격증명
    #      없이도 안전하다. 즉 **이 값을 비우는 것이 확실하게 끄는 방법**이다.
    #   2) 관리자 런타임 토글(/monitoring 화면, public.system_settings, 기본 OFF).
    #      배포만으로는 수집이 시작되지 않고, 켜는 조작은 audit.audit_logs 에 불변
    #      행으로 남는다.
    #
    # 값은 terraform output body_log_firehose_stream / body_log_bucket 에서 가져온다
    # (module "body_logging", 그쪽 기본값도 enabled=false 다). install-eks.sh 는 이 두
    # 값을 자동 주입하지 않는다 — 마스킹되지 않은 본문을 저장하는 스위치라 운영자가
    # 명시적으로 적어야 한다.
    FIREHOSE_STREAM_NAME: ""
    # Firehose 레코드 상한(1MB)을 넘는 본문의 S3 직행 fallback 버킷. 비어 있으면 상한
    # 초과 레코드는 버려진다(요청은 영향 없음). 위 스트림과 같은 버킷이어야 조회 경로가
    # 하나로 유지된다.
    BODY_LOG_S3_BUCKET: ""

# ----------------------------------------------------------------------------
# Admin API (U2, control-plane) — 관리자 REST API + VK 발급
# ----------------------------------------------------------------------------
adminApi:
  enabled: true
  replicaCount: 2

  image:
    repository: "llm-gateway/admin-api"
    tag: "1.0.68-invlogaudit"  # = 라이브(dev·prod)
    pullPolicy: "IfNotPresent"

  serviceAccount:
    create: true
    name: "admin-api"
    annotations: {}
    # IRSA for STS (FR-2.1a VK 발급 검증)
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/llm-gateway-admin-api

  service:
    type: "ClusterIP"
    port: 8080
    targetPort: 8080

  resources:
    requests:
      cpu: "300m"
      memory: "512Mi"
    limits:
      cpu: "1500m"
      memory: "1Gi"

  # HPA 는 CPU 만 사용 (gatewayProxy 와 동일 이유).
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  terminationGracePeriodSeconds: 30

  # liveness 는 /health (프로세스 alive 만 확인). readiness/startup 은 /health/ready
  # (DB+Redis 포함). DB 포화 시 pod kill 방지.
  livenessProbe:
    httpGet:
      path: "/health"
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 5

  readinessProbe:
    httpGet:
      path: "/health/ready"
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: "/health/ready"
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # admin-api 앱 설정은 (oidc 를 제외하면) 전용 블록 없이 전부 이 자유 map 을 통과한다 —
  # templates/admin-api/deployment.yaml 의 `range $key, $value := .Values.adminApi.env`.
  # 새 설정을 넣을 때 차트에 구조를 추가할 필요가 없다.
  env:
    LOG_LEVEL: "INFO"
    WORKERS: "2"
    DEV_LOGIN_ENABLED: "false"  # production에선 반드시 false
    DEFAULT_USER_BUDGET_USD: "1000"
    # ── Bedrock invocation log 감사 대조 (기본 OFF) ──
    # 비어 있으면 /admin/audit/invocation-log/* 가 503(미설정)을 반환한다. 켜는 절차와
    # 주의사항은 values-eks-fargate-dev.yaml 의 같은 키 주석 참조. 요약:
    #   - 값은 terraform output bedrock_invocation_log_{group,region} 에서 가져온다
    #   - REGION 은 배포 리전이 아니라 **모델 실행 리전**(GPT-5.6 runtime plane = us-east-2)
    #   - 리전 단위로 계정 전체 본문을 수집하므로 운영자가 명시적으로 켜야 한다
    # BEDROCK_INVOCATION_LOG_GROUP: ""
    # BEDROCK_INVOCATION_LOG_REGION: "us-east-2"
    # BEDROCK_INVOCATION_LOG_BODIES_ENABLED: "false"

  # --------------------------------------------------------------------------
  # OIDC 인증 (Cognito / Keycloak / Okta / Azure AD / IC)
  # --------------------------------------------------------------------------
  # OIDC_ISSUER_URL 가 비어있으면 OIDC 비활성, STS 흐름만 동작.
  # 채우면 dual-mode (STS + OIDC).
  #
  # EKS Fargate 환경에서는 install-eks.sh 가 terraform output (cognito_*) 을
  # 자동으로 주입. dev override 는 values-{env}.yaml 에서.
  oidc:
    enabled: false  # values-eks-fargate-{dev,prod}.yaml 에서 true 로 override
    issuerUrl: ""              # OIDC_ISSUER_URL — Cognito issuer URL
    audience: ""               # OIDC_AUDIENCE — Cognito 면 빈 값 (access_token 에 aud 없음)
    providerName: "oidc"       # OIDC_PROVIDER_NAME — 예: "oidc:cognito"
    discoveryUrlOverride: ""   # OIDC_DISCOVERY_URL_OVERRIDE — 보통 비워둠
    jwksCacheTtlSeconds: 3600
    # Claim 매핑 (IDP 별 차이 흡수)
    userIdClaim: "sub"
    emailClaim: "email"
    nameClaim: "name"
    groupsClaim: "cognito:groups"  # Cognito 표준. Keycloak/Okta 면 "groups"
    # 그룹 → 팀 매핑 정규식 (named group 'team' 필수)
    # 그룹 → 팀 매핑 prefix. underscore 개수로 파싱:
    #   Claude_<team>        → Default Department 하위 <team> 팀
    #   Claude_<dept>_<team> → <dept> 부서 자동 생성 후 <team> 팀
    #   그 외                → reject
    groupPrefix: "Claude_"
    # 매칭 그룹 없을 때 동작: false=DEFAULT_TEAM 으로 fallback, true=거부.
    # true 권장 — Cognito 를 팀 구조의 single source of truth 로 강제.
    rejectUnmatchedGroups: true
    # 게이팅 (옵션). 비우면 모든 OIDC 사용자 통과.
    requiredGroup: ""
    # OIDC 흐름 VK TTL (시간). STS 는 별도 (rotation policy default 90일).
    # 1h — Cognito group 변경이 silent refresh 로 ~2h 안에 자동 반영되도록 짧게.
    vkTtlHours: 1

  # Admin 부트스트랩 — 둘 중 하나라도 매칭되면 ADMIN role 자동 부여
  adminBootstrap:
    emails: []          # ADMIN_EMAILS — 예: ["admin@example.com"]
    groups: []          # ADMIN_GROUPS — 예: ["ClaudeAdmin"]

  # 자동 프로비저닝 기본값 (Default Department / Team UUIDs)
  # db/init/03_seed_data.sql 의 시드 UUID 와 정확히 일치해야 함.
  autoProvisioning:
    defaultTeamId: "00000000-0000-4000-a000-000000000003"
    defaultDeptId: "00000000-0000-4000-a000-000000000002"
    systemUserId: "00000000-0000-4000-a000-000000000010"

# ----------------------------------------------------------------------------
# Admin UI (Next.js 14 — 관리자 웹)
# ----------------------------------------------------------------------------
adminUi:
  enabled: true
  replicaCount: 2

  image:
    repository: "llm-gateway/admin-ui"
    tag: "1.0.99-modelform"  # = 라이브(dev·prod)
    pullPolicy: "IfNotPresent"

  serviceAccount:
    create: true
    name: "admin-ui"
    annotations: {}

  service:
    type: "ClusterIP"
    port: 3000
    targetPort: 3000

  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  # HPA 는 CPU 만 사용 (gatewayProxy 와 동일 이유).
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  terminationGracePeriodSeconds: 30

  # Next.js 기동이 느려서 startup probe 중요
  startupProbe:
    httpGet:
      path: "/api/health"
      port: 3000
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

  livenessProbe:
    httpGet:
      path: "/api/health"
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10

  readinessProbe:
    httpGet:
      path: "/api/health"
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5

  # Next.js는 /tmp + /.next/cache에 쓰기 필요 → readOnlyRootFilesystem false
  securityContextOverride:
    readOnlyRootFilesystem: false

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # admin-ui 앱 설정은 전용 블록 없이 전부 이 자유 map 을 통과한다 —
  # templates/admin-ui/deployment.yaml:87 의 `range $key, $value := .Values.adminUi.env`.
  env:
    NODE_ENV: "production"
    NEXT_TELEMETRY_DISABLED: "1"
    OTEL_SERVICE_NAME: "admin-ui"
    # ── 브라우저 SSO (OIDC Authorization Code + PKCE) — 기본 OFF ──
    #
    # ⚠️ 이 세 개가 **admin-ui 의 유일한 prod 로그인 경로**를 켠다. 셋 다 비어 있고
    #    DEV_LOGIN_ENABLED 도 "false" 면 로그인 방법이 존재하지 않는다 —
    #    prod 가 정확히 그 상태였다(A3). 그 상태에서 / 로 들어오면 이제
    #    /api/auth/login 이 아래 변수 이름을 찍은 503 을 돌려준다(예전엔 본문 없는 404).
    #
    # ⚠️ 일부러 **주석 처리**해서 둔다. 위 range 는 값이 빈 문자열이어도 env 항목을
    #    그대로 렌더하므로(`- name: X` + `value: ""`), 빈 기본값을 살려 두면 오늘과
    #    다른 pod spec 이 나와 admin-ui 3개가 전부 롤링 재시작한다. 기능이 꺼져 있는데
    #    파드를 굴릴 이유가 없다. 같은 이유로 adminApi.env 의
    #    BEDROCK_INVOCATION_LOG_* 도 주석으로 둔다(values.yaml:603 참조).
    #    ⇒ 켤 때는 아래 3줄의 주석을 풀고 값을 채운다(그 순간부터 렌더된다).
    #
    # 값 채우는 법 (Cognito):
    #   OIDC_AUTHORIZE_URL / OIDC_TOKEN_URL 은 issuer 가 **아니다**. issuer 는
    #   https://cognito-idp.<region>.amazonaws.com/<poolId> 이지만 authorize/token 은
    #   hosted UI 도메인 https://<domain>.auth.<region>.amazoncognito.com/oauth2/{authorize,token} 이다.
    #   Keycloak 이면 <issuer>/protocol/openid-connect/{auth,token}.
    #   app client 의 Allowed callback URL 에 https://<admin-ui host>/api/auth/callback 을 등록해야 한다.
    # OIDC_CLIENT_ID: ""       # 비면 SSO OFF. 채우면 /api/auth/login 이 authorize 로 302.
    # OIDC_AUTHORIZE_URL: ""   # 예: https://<domain>.auth.ap-northeast-2.amazoncognito.com/oauth2/authorize
    # OIDC_TOKEN_URL: ""       # 예: https://<domain>.auth.ap-northeast-2.amazoncognito.com/oauth2/token
    #
    # 선택 (없으면 기본값):
    # OIDC_REDIRECT_URI: ""    # 비면 요청의 Host + x-forwarded-proto 로 조립. IdP 등록값과
    #                          # 정확히 일치해야 할 때만 명시한다.
    # OIDC_SCOPES: ""          # 기본 "openid email profile"
    # OIDC_COOKIE_TOKEN: ""    # "access_token" 이면 access_token 을 쿠키에 넣는다. 기본은 id_token.
    #
    # ⚠️ OIDC_CLIENT_SECRET 은 **여기에 절대 쓰지 않는다**. 이 차트의 시크릿 경로는
    #    templates/common/secret.yaml 의 `{{ fullname }}-app` Secret 이다
    #    (externalSecrets.enabled=true 면 ESO 가 "<secretPathPrefix><env>/app" 에서 주입,
    #     false 면 .Values.secrets.app 에서 생성 — git 커밋 금지).
    #    다만 위 range 는 `value:` 만 렌더하고 secretKeyRef 를 못 만들기 때문에,
    #    confidential client 를 쓰려면 templates/admin-ui/deployment.yaml 에 NEXTAUTH_SECRET
    #    (같은 파일 77-81줄)처럼 secretKeyRef env 블록을 추가해야 한다.
    #    ⇒ 권장은 **secret 없는 public client + PKCE**. 코드는 양쪽 다 지원한다
    #      (app/api/auth/callback/route.ts — secret 이 있으면 HTTP Basic 을 붙인다).

# ----------------------------------------------------------------------------
# Scheduler (admin-api 이미지를 다른 CMD로 실행 — ROI 집계 cron)
# Singleton 필수: replicas=1, HPA 없음, PDB minAvailable=0
# ----------------------------------------------------------------------------
scheduler:
  enabled: true
  replicaCount: 1  # 절대 2 이상 금지 (중복 cron 실행 방지)

  image:
    # admin-api 이미지 재사용 (command만 다름) — 태그도 admin-api 와 항상 같이 움직인다
    repository: "llm-gateway/admin-api"
    tag: "1.0.68-invlogaudit"  # = 라이브(dev·prod)
    pullPolicy: "IfNotPresent"

  command: ["python", "-m", "app.scheduler.main"]

  serviceAccount:
    create: true
    name: "scheduler"
    annotations: {}

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  podDisruptionBudget:
    enabled: false  # singleton — 배포 시 순간 down 허용

  terminationGracePeriodSeconds: 30

  # Scheduler는 HTTP 서버가 없음 → exec probe.
  # DB 드라이버는 asyncpg (psycopg2 미설치). import 만으로는 모듈 존재 확인 수준의 liveness.
  livenessProbe:
    exec:
      command:
        - "python"
        - "-c"
        - "import asyncpg"
    initialDelaySeconds: 30
    periodSeconds: 60
    timeoutSeconds: 10

  readinessProbe:
    exec:
      command:
        - "python"
        - "-c"
        - "import asyncpg"
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  env:
    LOG_LEVEL: "INFO"
    ROI_AGGREGATION_CRON: "*/15 * * * *"
    KEY_EXPIRY_CRON: "0 * * * *"

# ----------------------------------------------------------------------------
# Notification Worker (U3) — Redis pub/sub → email/HTTP
# ----------------------------------------------------------------------------
notificationWorker:
  enabled: true
  replicaCount: 2

  image:
    repository: "llm-gateway/notification-worker"
    tag: "1.0.43-rebrand"  # = 라이브(dev·prod)
    pullPolicy: "IfNotPresent"

  serviceAccount:
    create: true
    name: "notification-worker"
    annotations: {}

  resources:
    requests:
      cpu: "100m"  # Fargate 최소 하한 주의 (0.25 vCPU로 반올림됨)
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  terminationGracePeriodSeconds: 30

  # livenessProbe 는 외부 의존성 검사 금지 (Redis 장애로 pod restart 해도 해결 안 됨).
  # PID 1 alive 만 체크 — Python import/TLS 지연에 안 휘둘림.
  livenessProbe:
    exec:
      command: ["sh", "-c", "kill -0 1"]
    initialDelaySeconds: 30
    periodSeconds: 60
    timeoutSeconds: 5

  readinessProbe:
    exec:
      command:
        - "python"
        - "-c"
        # K8s 는 probe command 안의 $(VAR) 를 1-level 만 치환. REDIS_URL 값 자체가
        # "rediss://:$(REDIS_PASSWORD)@..." 이라 이중 치환이 안 되어 literal 이 Python 에 전달됨.
        # 회피: os.environ 으로 런타임에 실제 확장된 값을 읽음.
        - "import os, redis; r=redis.Redis.from_url(os.environ['REDIS_URL']); r.ping()"
    # ElastiCache cluster mode + Fargate 환경에서 TLS handshake + Python import 가
    # 5s 안에 안정적으로 끝나지 않음 → helm rollout 이 Progress deadline 실패.
    # 15s 여유 + periodSeconds 60s 로 probe 부하도 경감.
    initialDelaySeconds: 15
    periodSeconds: 60
    timeoutSeconds: 15

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  env:
    LOG_LEVEL: "INFO"
    OTEL_SERVICE_NAME: "notification-worker"

  # 이메일 발송 설정 — 고객 내부 메일 API / SMTP / mock
  email:
    provider: "internal_api"  # "internal_api" | "smtp" | "mock"
    internalApi:
      url: ""                 # 고객 내부 메일 API URL (예: http://mail-api.internal/send)
      fromAddress: "no-reply@llm-gateway.local"
      fromName: "LLM Gateway"
    smtp:
      host: ""
      port: 587
      startTls: true
      fromAddress: ""
      credentialsSecretName: ""

# ----------------------------------------------------------------------------
# Cost Recorder Worker — Redis Stream → DB batch flusher (FR-3.3 critical path)
# ----------------------------------------------------------------------------
costRecorderWorker:
  enabled: true
  # consumer group 방식이라 여러 replica가 안전하게 병렬 소비 가능
  replicaCount: 2

  image:
    repository: "llm-gateway/cost-recorder-worker"
    tag: "1.0.47-websearch"  # = 라이브(dev·prod)
    pullPolicy: "IfNotPresent"

  serviceAccount:
    create: true
    name: "cost-recorder-worker"
    annotations: {}

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    # Redis Stream 지연(XLEN)을 직접 측정해 KEDA로 교체하면 더 정확
    targetCPUUtilizationPercentage: 70

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  terminationGracePeriodSeconds: 60  # 배치 flush 완료까지 대기 여유

  # livenessProbe 는 외부 의존성 검사 금지 (Redis 장애로 pod restart 해도 해결 안 됨).
  # PID 1 alive 만 체크 — Python import/TLS 지연에 안 휘둘림.
  livenessProbe:
    exec:
      command: ["sh", "-c", "kill -0 1"]
    initialDelaySeconds: 30
    periodSeconds: 60
    timeoutSeconds: 5

  readinessProbe:
    exec:
      command:
        - "python"
        - "-c"
        # K8s 는 probe command 안의 $(VAR) 를 1-level 만 치환. REDIS_URL 값 자체가
        # "rediss://:$(REDIS_PASSWORD)@..." 이라 이중 치환이 안 되어 literal 이 Python 에 전달됨.
        # 회피: os.environ 으로 런타임에 실제 확장된 값을 읽음.
        - "import os, redis; r=redis.Redis.from_url(os.environ['REDIS_URL']); r.ping()"
    # ElastiCache cluster mode + Fargate 환경에서 TLS handshake + Python import 가
    # 5s 안에 안정적으로 끝나지 않음 → helm rollout 이 Progress deadline 실패.
    # 15s 여유 + periodSeconds 60s 로 probe 부하도 경감.
    initialDelaySeconds: 15
    periodSeconds: 60
    timeoutSeconds: 15

  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  env:
    LOG_LEVEL: "INFO"
    OTEL_SERVICE_NAME: "cost-recorder-worker"
    COST_STREAM_KEY: "cost:stream"
    COST_STREAM_GROUP: "cost-recorder-workers"
    # Consumer 이름은 pod name 기반으로 자동 설정 (Downward API)
    # COST_STREAM_CONSUMER 는 환경변수 주입 시점에 HOSTNAME 값으로 치환
    BATCH_MAX_SIZE: "100"
    BATCH_MAX_INTERVAL_SEC: "5"
    DAILY_USAGE_AGG_CRON: "10 0 * * *"
